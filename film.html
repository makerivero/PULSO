<style>
:root{color-scheme:dark;--bg:#050507;--panel:#0c0c11;--raised:#13131a;--line:#22222b;--line-2:#2e2e39;--text:#ececf1;--muted:#8d8d9c;--accent:#ffd23a;--ink:#0b0b0e}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.45 'Space Grotesk',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font:700 22px/1.1 'Unbounded',sans-serif;letter-spacing:-.03em}h1 small{display:block;font:500 12px/1.6 'JetBrains Mono',monospace;color:var(--accent);letter-spacing:.12em;text-transform:uppercase}
.spacer{flex:1}a{color:var(--muted)}
.screen{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.screen canvas{width:100%;height:100%;display:block}
.big{position:absolute;inset:0;display:grid;place-items:center}.big span{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#000a;border:1px solid #fff3}
.big svg{width:30px;height:30px;fill:#fff;margin-left:4px}
.bar{display:flex;align-items:center;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--raised);font-weight:500;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--accent);color:var(--ink);border-color:transparent;font-weight:600}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.time{font:500 13px/1 'JetBrains Mono',monospace;color:var(--muted);min-width:110px}
input[type=range]{flex:1;accent-color:var(--accent)}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.panel label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.panel select,.panel input[type=number]{background:var(--raised);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:130px}
.status{font:500 12px/1.5 'JetBrains Mono',monospace;color:var(--muted);width:100%}
.prog{height:6px;border-radius:3px;background:#1a1a23;overflow:hidden;width:100%}.prog i{display:block;height:100%;width:0;background:var(--accent)}
video{width:100%;border-radius:8px;background:#000}
</style>
</head>
<body>
<div class="wrap">
 <header><h1><small>Milton Valenzuela</small>Bendito error</h1><div class="spacer"></div><a href="index.html">PULSO</a></header>
 <div class="screen"><canvas id="view" width="1280" height="720" aria-label="Videoclip"></canvas><button class="big" id="big" type="button" aria-label="Reproducir"><span><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></span></button></div>
 <div class="bar"><button class="btn" id="play" type="button"><svg class="i" viewBox="0 0 24 24" id="playIcon"><path d="M7 4l13 8-13 8z"/></svg></button><span class="time" id="time">0:00 / 0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posición"></div>
 <div class="panel">
  <label>Resolución<select id="res"><option value="1080">1920 × 1080</option><option value="720">1280 × 720</option></select></label>
  <label>Desde (s)<input type="number" id="from" min="0" step="0.1" value="0"></label>
  <label>Hasta (s)<input type="number" id="to" min="0" step="0.1" placeholder="Final"></label>
  <button class="btn primary" id="export" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Exportar video</button>
  <div class="status" id="status"></div><div class="prog" id="prog" hidden><i id="progBar"></i></div>
  <div id="result" hidden style="width:100%;display:flex;flex-direction:column;gap:10px"><video id="resultVideo" controls playsinline></video><a class="btn primary" id="resultLink" download>Descargar video</a></div>
 </div>
</div>
<script src="games.js"></script><script src="crt.js"></script><script src="film.js"></script><script src="bendito.js"></script><script src="scenes_chorus.js"></script><script src="scenes_disco.js"></script><script src="scenes_montage.js"></script><script src="scenes_finale.js"></script><script src="vendor/mp4-muxer-5.2.2.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const STYLE={curve:1,scan:.6,ambient:1,glow:1};
const END=SHOTS[SHOTS.length-1].t1,FADE_IN=1.2;
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t-m*60);return m+':'+String(s).padStart(2,'0');};
const film=new Film();let crt=null;try{crt=new CRT($('view'));}catch{}
let actx=null,buf=null,src=null,playing=false,startAt=0,offset=0,dur=END;
const fade=t=>Math.min(1,t/FADE_IN,(END-t)/3);
async function loadAudio(){
 actx=new (window.AudioContext||window.webkitAudioContext)();
 for(const list of [['media/bendito-error/song.mp3'],['media/bendito-error/drums.mp3','media/bendito-error/bass.mp3','media/bendito-error/other.mp3','media/bendito-error/vocals.mp3']]){
  try{const bufs=await Promise.all(list.map(async u=>{const r=await fetch(u);if(!r.ok)throw 0;return actx.decodeAudioData(await r.arrayBuffer());}));
   const len=Math.max(...bufs.map(b=>b.length)),out=actx.createBuffer(2,len,bufs[0].sampleRate);for(const b of bufs)for(let ch=0;ch<2;ch++){const o=out.getChannelData(ch),d=b.getChannelData(Math.min(ch,b.numberOfChannels-1));for(let i=0;i<d.length;i++)o[i]+=d[i];}
   buf=out;return;}catch{}}
}
function now(){return playing?actx.currentTime-startAt:offset;}
function play(){if(!buf||!actx)return;actx.resume();if(offset>=END-.05)offset=0;src=actx.createBufferSource();src.buffer=buf;src.connect(actx.destination);src.start(0,offset);startAt=actx.currentTime-offset;playing=true;ui();}
function pause(){if(!playing)return;offset=now();playing=false;try{src.stop();}catch{}ui();}
function ui(){$('playIcon').innerHTML=playing?'<path d="M7 5v14M17 5v14"/>':'<path d="M7 4l13 8-13 8z"/>';$('big').hidden=playing;}
function draw(t){film.render(Math.min(t,END-1e-3),SHOTS);if(crt)crt.render(film.canvas,STYLE,t,playing||exporting?fade(t):1);}
let exporting=false;
function loop(){requestAnimationFrame(loop);if(exporting)return;let t=now();if(playing&&t>=END){pause();offset=END;t=END;}draw(t);$('time').textContent=fmt(t)+' / '+fmt(END);if(!seeking)$('seek').value=Math.round(t/END*1000);}
let seeking=false;$('seek').addEventListener('input',e=>{seeking=true;const t=e.target.value/1000*END;if(playing){offset=t;try{src.stop();}catch{}play();}else offset=t;});$('seek').addEventListener('change',()=>seeking=false);
$('play').onclick=()=>playing?pause():play();$('big').onclick=play;
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();playing?pause():play();}});
// ── Export: frame-exact, encoded in the browser, downloads when done.
class BlobSink{constructor(){this.blob=new Blob([]);}write(data,pos){const d=new Uint8Array(data),end=this.blob.size;if(pos===end)this.blob=new Blob([this.blob,d]);else if(pos>end)this.blob=new Blob([this.blob,new Uint8Array(pos-end),d]);else this.blob=new Blob([this.blob.slice(0,pos),d,this.blob.slice(Math.min(end,pos+d.length))]);}}
async function pick(W,H){for(const [codec,mux]of [[W>1280?'avc1.640028':'avc1.64001F','avc'],['vp09.00.40.08','vp9']]){const cfg={codec,width:W,height:H,bitrate:W>1280?10e6:6e6,framerate:30};try{if((await VideoEncoder.isConfigSupported(cfg)).supported)return {cfg,mux};}catch{}}return null;}
async function pickA(sr){if(!('AudioEncoder' in window))return null;for(const [codec,mux]of [['mp4a.40.2','aac'],['opus','opus']]){const cfg={codec,sampleRate:sr,numberOfChannels:2,bitrate:192000};try{if((await AudioEncoder.isConfigSupported(cfg)).supported)return {cfg,mux};}catch{}}return null;}
async function exportRange(from,to,res=1080,withAudio=true,fps=30){
 const W=res>720?1920:1280,H=res>720?1080:720,v=await pick(W,H);if(!v)throw new Error('Este navegador no puede codificar video. Usá Chrome o Edge de escritorio.');
 const a=withAudio&&buf?await pickA(buf.sampleRate):null,sink=new BlobSink();
 const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.StreamTarget({onData:(d,p)=>sink.write(d,p),chunked:true,chunkSize:8*1048576}),video:{codec:v.mux,width:W,height:H,frameRate:fps},audio:a?{codec:a.mux,numberOfChannels:2,sampleRate:a.cfg.sampleRate}:undefined,fastStart:false,firstTimestampBehavior:'offset'});
 let fail=null;
 if(a){const enc=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>fail=e});enc.configure(a.cfg);const sr=buf.sampleRate,s0=Math.round(from*sr),n=Math.round((to-from)*sr),L=buf.getChannelData(0),R=buf.getChannelData(1);
  for(let i=0;i<n;i+=4096){const k=Math.min(4096,n-i),data=new Float32Array(k*2);data.set(L.subarray(s0+i,s0+i+k),0);data.set(R.subarray(s0+i,s0+i+k),k);const ad=new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:k,numberOfChannels:2,timestamp:Math.round(i/sr*1e6),data});enc.encode(ad);ad.close();}await enc.flush();enc.close();}
 const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const out=new CRT(canvas),enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>fail=e});enc.configure(v.cfg);
 const total=Math.round((to-from)*fps);
 for(let i=0;i<total&&!fail;i++){const t=from+i/fps;film.render(Math.min(t,END-1e-3),SHOTS);out.render(film.canvas,STYLE,t,fade(t));const fr=new VideoFrame(canvas,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});enc.encode(fr,{keyFrame:i%(fps*2)===0});fr.close();
  if(enc.encodeQueueSize>4)await new Promise(r=>{const f=()=>{if(enc.encodeQueueSize<=2){enc.removeEventListener('dequeue',f);r();}};enc.addEventListener('dequeue',f);});
  if(i%15===0){$('status').textContent=`Cuadro ${i+1} de ${total}`;$('progBar').style.width=(i/total*100)+'%';await new Promise(r=>setTimeout(r));}}
 await enc.flush();enc.close();if(fail)throw fail;muxer.finalize();return sink.blob;
}
$('export').onclick=async()=>{
 pause();exporting=true;$('export').disabled=true;$('prog').hidden=false;$('result').hidden=true;
 try{const from=Math.max(0,Number($('from').value)||0),to=Math.min(END,$('to').value===''?END:Number($('to').value)),blob=await exportRange(from,Math.max(from+.5,to),Number($('res').value));
  const url=URL.createObjectURL(blob),name=`bendito-error-milton-valenzuela-${$('res').value}p.mp4`;$('resultVideo').src=url;$('resultLink').href=url;$('resultLink').download=name;$('result').hidden=false;
  $('status').textContent=`Listo: «${name}» (${(blob.size/1048576).toFixed(1)} MB). Se descargó en tu carpeta de Descargas.`;const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();}
 catch(e){$('status').textContent='No se pudo exportar: '+(e.message||e);}
 finally{exporting=false;$('export').disabled=false;$('prog').hidden=true;}
};
window.__film={exportRange,get ready(){return !!buf;},END};
ui();loop();loadAudio();
</script>
